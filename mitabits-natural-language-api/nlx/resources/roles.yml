Chief Executive Officer:
  synonyms: CEO, chief executive, CE
  description: Chief executive officer (CEO), or just chief executive (CE), is the most senior corporate, executive, or administrative officer in charge of managing an organization – especially an independent legal entity such as a company or nonprofit institution.

Chief Technology Officer:
  synonyms: CTO, Technical officer, chief technologist, Technical Director, Tech Director
  description: A chief technology officer (CTO), sometimes known as a chief technical officer or chief technologist, is an executive-level position in a company or other entity whose occupation is focused on the scientific and technological issues within an organization.

Chief Scientific Officer:
  synonyms: CSO
  description: Position at the head of scientific research operations at organizations or companies performing significant scientific research projects.

Chief Research Officer:
  synonyms: CRO, Chief Researcher, Research director, Director of Research, research officer
  description: The chief research officer (CRO), research officer, or research director, is a job title commonly given to the most senior executive in an enterprise responsible for the research that supports enterprise goals.

Software developer:
  synonyms: Developer, programmer, software engineer
  description: Person who creates computer software.

Engineer:
  description: Engineers, as practitioners of engineering, are professionals who invent, design, analyze, build and test machines, complex systems, structures, gadgets and materials to fulfill functional objectives and requirements while considering the limitations imposed by practicality, regulation, safety and cost.

Scientist:
  description: A scientist is someone who conducts scientific research to advance knowledge in an area of interest.