Google:
  synonyms: Google LLC
  founded: 1998-09-04
  description: Google LLC is an American multinational technology company that specializes in Internet-related services and products, which include online advertising technologies, a search engine, cloud computing, software, and hardware.

Facebook:
  synonyms: Facebook Inc.
  founded: 2004-02-04
  description: Facebook Inc is an American social media conglomerate corporation based in Menlo Park, California.


Tesla:
  synonyms: Tesla Motors, Inc.
  founded: 2003-07-01
  description: Tesla Inc. is an American electric vehicle and clean energy company based in Palo Alto, California. Tesla's current products include electric cars, battery energy storage from home to grid scale, solar products and related products and services.


SpaceX:
  synonyms: Space Exploration Technologies Corp
  founded: 2002-05-06
  description: Space Exploration Technologies Corp is an American aerospace manufacturer and space transportation services company headquartered in Hawthorne, California. It was founded in 2002 by Elon Musk with the goal of reducing space transportation costs to enable the colonization of Mars.

OpenAI:
  synonyms: OpenAI Inc.
  founded: 2015-12-11
  description: OpenAI is an artificial intelligence research laboratory consisting of the for-profit corporation OpenAI LP and its parent company, the non-profit OpenAI Inc. The company, considered a competitor to DeepMind, conducts research in the field of artificial intelligence (AI) with the stated goal of promoting and developing friendly AI in a way that benefits humanity as a whole.

DeepMind:
  synonyms: DeepMind Technologies
  founded: 2010-09-23
  description: DeepMind Technologies is a UK based artificial intelligence company and research laboratory founded in September 2010, and acquired by Google in 2014. The company is based in London, with research centres in Canada, France, and the United States. In 2015, it became a wholly owned subsidiary of Alphabet Inc.

Alphabet:
  synonyms: Alphabet Inc.
  founded: 2015-10-02
  description: Alphabet Inc. is an American multinational conglomerate headquartered in Mountain View, California. It was created through a restructuring of Google on October 2, 2015, and became the parent company of Google and several former Google subsidiaries.

GCHQ:
  synonyms: Government Communications Headquarters, Government Code and Cypher School, GC&CS
  founded: 1919-11-01
  description: Government Communications Headquarters, commonly known as GCHQ, is an intelligence and security organisation responsible for providing signals intelligence (SIGINT) and information assurance to the government and armed forces of the United Kingdom.